	<head>
		<meta charset="utf-8" />
		<script>
			/*
				Blocking on purpose, and tiny. Stamps data-theme before first paint
				so there is no flash of the wrong theme. common/theme.js re-applies
				this with the full logic once modules load.
			*/
			(function () {
				try {
					var pref = 'system';
					var raw = window.localStorage.getItem('GlyphrStudio');
					if (raw) {
						var stored = JSON.parse(raw).themePreference;
						if (stored) pref = stored;
					}
					var dark =
						pref === 'dark' ||
						(pref === 'system' &&
							window.matchMedia &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>
		<!--
			The tab name before any script runs. main.js sets it from PRODUCT_NAME
			once the app boots, so this is the first-paint value rather than the
			source of truth - but it is what someone sees if the app never starts,
			so keep it in step with the constant.
		-->
		<title>Glyva</title>
		<meta name="viewport" content="width=device-width" />
		<link rel="icon" href="./common/graphics/glyva-favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="./common/graphics/glyva-icon.svg" />
		<link rel="apple-touch-icon" sizes="180x180" href="./common/graphics/glyva-touch-180.png" />
		<link rel="manifest" href="/manifest.json" />
		<script src="app/main.js" type="module"></script>
		<script type="module">
			import { glyphrStudioOnLoad, getGlyphrStudioApp, log } from './app/main.js';
			window.log = log;
			document.addEventListener('DOMContentLoaded', glyphrStudioOnLoad);
			window._GlyphrStudioApp = getGlyphrStudioApp();
		</script>
		<style>
			/*
				The boot splash: what is on screen before app.css has loaded, which is
				the one place inline CSS earns its place.

				It follows the theme. The blocking script above stamps data-theme
				on <html> before first paint and tokens.css is a stylesheet link, so
				by the time anything here is drawn the semantic tokens already
				resolve for the right theme: the text is --text-primary, the mark is
				--accent, and the ground is a gradient of the theme's own surfaces -
				a whisper of depth in light, the shell's dark gradient in dark. It
				used to be fixed dark with three colour literals of its own, from
				before the theme was stamped this early.
			*/
			:root {
				--splash-ground: linear-gradient(150deg, var(--bg-surface), var(--bg-app));
				/*
					The pen's hand: eases in and out symmetrically, so each stroke
					starts from rest and settles into its anchor instead of snapping
					off the mark the way the tool's --ease does. Same status as the
					durations below - brand motion, the splash's own.
				*/
				--splash-ease: cubic-bezier(0.65, 0, 0.35, 1);
			}

			:root[data-theme='dark'] {
				--splash-ground: var(--dark-gradient-background);
			}

			body,
			#app__wrapper,
			#app__landing-page {
				height: 100%;
				width: 100%;
				min-height: 100%;
				min-width: 100%;
				position: absolute;
				top: 0px;
				left: 0px;
				overflow: hidden;
			}

			body {
				background: var(--splash-ground);
			}

			#app__wrapper {
				background-color: var(--bg-app);
			}

			/*
				One centred column: the mark, or, if the app never boots, the
				message that replaces it. Both sit at the optical centre - a little
				above the geometric one, which is what the bottom padding is for.

				Above the shell. The app renders into #app__wrapper, which comes
				after this element in the document and so painted over it the
				moment the hub was ready - the splash was drawing its mark behind
				the app, and nobody saw it. --z-full-screen, the top of the scale:
				while the splash is up, nothing else is meant to be reachable, and
				fadeOutLandingPage() removes it once the fade is done.
			*/
			#app__landing-page {
				z-index: var(--z-full-screen);
				font-family: var(--font-ui);
				opacity: 1;
				visibility: visible;
				transition: opacity var(--dur-slow) var(--ease);
				background: var(--splash-ground);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 0 var(--sp-8) var(--sp-10);
				box-sizing: border-box;
			}

			/*
				The Glyva mark and the name under it. The mark is the same drawing
				as lineIcons.appMark in common/icons.js, inlined here because the
				splash is on screen before any module has loaded; keep the two in
				step. currentColor, so the colour is set once, on the block, from
				the theme's tokens. 120px is the mark's 24 grid times five.
			*/
			.splash__brand {
				display: grid;
				justify-items: center;
				gap: var(--sp-6);
				color: var(--text-primary);
			}

			.splash__mark {
				display: block;
				width: 120px;
				height: 120px;
				color: var(--accent);
			}

			.splash__name {
				font-size: var(--fs-2xl);
				font-weight: var(--fw-semibold);
				letter-spacing: var(--tracking-tight);
				line-height: var(--lh-tight);
			}

			/*
				The mark draws itself, the way the pen tool draws it.

				The control point is placed first. The pen then draws one path from
				it: the handle in to the top anchor, the bowl round to the left and
				the bottom, a lift back up to the bar's start, the bar out to its
				anchor - and each anchor pops the moment the pen reaches it. A nib
				rides ahead of every stroke: a ring with a point in it, the pen
				tool's cursor, handed from segment to segment along the same
				offset-path the stroke trims along, so they can never drift apart.
				Then the letter is set - the spur wipes down from under the bar -
				the construction lines recede to the 40% they rest at, and the name
				rises. About 1.6s; fadeOutLandingPage() waits for the last of it
				before it fades, so the sequence is never cut in half.

				Each part carries its own delay and length as --t and --d, so the
				choreography reads off the markup. The literal durations are the
				splash's, like its colours: this is brand motion, off the editor's
				scale on purpose, and the only place a duration outside tokens.css
				is allowed. Reduced motion skips it all and shows the finished mark.

				stroke-dasharray from pathLength="1", so every path trims on 1 -> 0
				regardless of its real length; the handle is written right to left
				so it trims in the direction the pen travels.
			*/
			.splash__draw {
				stroke-dasharray: 1;
				stroke-dashoffset: 1;
				animation: splash-draw var(--d) var(--splash-ease) var(--t) forwards;
			}

			.splash__pop {
				transform-box: fill-box;
				transform-origin: center;
				transform: scale(0);
				animation: splash-pop 220ms var(--ease-out) var(--t) forwards;
			}

			.splash__spur {
				clip-path: inset(0 0 100% 0);
				opacity: 0;
				animation: splash-set 900ms var(--splash-ease) var(--t) forwards;
			}

			.splash__path {
				animation: splash-recede 360ms var(--splash-ease) var(--t) forwards;
			}

			.splash__nib {
				offset-path: var(--p);
				offset-rotate: 0deg;
				offset-distance: 0%;
				opacity: 0;
				animation: splash-nib var(--d) var(--splash-ease) var(--t) forwards;
			}

			.splash__name {
				opacity: 0;
				transform: translateY(6px);
				animation: splash-rise 280ms var(--ease-out) var(--t) forwards;
			}

			@keyframes splash-draw {
				to { stroke-dashoffset: 0; }
			}
			@keyframes splash-pop {
				to { transform: scale(1); }
			}
			@keyframes splash-set {
				to { clip-path: inset(0 0 0 0); opacity: 1; }
			}
			@keyframes splash-recede {
				to { opacity: 0.4; }
			}
			@keyframes splash-nib {
				0% { opacity: 1; offset-distance: 0%; }
				99% { opacity: 1; }
				100% { opacity: 0; offset-distance: 100%; }
			}
			@keyframes splash-rise {
				to { opacity: 1; transform: none; }
			}

			@media (prefers-reduced-motion: reduce) {
				.splash__draw,
				.splash__pop,
				.splash__spur,
				.splash__path,
				.splash__name {
					animation: none;
					stroke-dashoffset: 0;
					transform: none;
					clip-path: none;
					opacity: 1;
				}
				.splash__path {
					opacity: 0.4;
				}
				.splash__nib {
					animation: none;
					opacity: 0;
				}
			}
			}
		</style>
		<!--
			Load order matters: tokens define the variables, colors maps the legacy
			ramps onto them, and everything after consumes both.
		-->
		<link rel="stylesheet" type="text/css" href="./common/tokens.css" />
		<link rel="stylesheet" type="text/css" href="./common/colors.css" />
		<link rel="stylesheet" type="text/css" href="./common/resets.css" />
		<link rel="stylesheet" type="text/css" href="./app/app.css" />
		<link rel="stylesheet" type="text/css" href="./controls/dialogs/dialogs.css" />
		<link rel="stylesheet" type="text/css" href="./controls/fancy-slider/fancy-slider.css" />
		<link rel="stylesheet" type="text/css" href="./controls/tabs/tab-control.css" />
		<link rel="stylesheet" type="text/css" href="./controls/menu-button/menu-button.css" />
		<link rel="stylesheet" type="text/css" href="./controls/tooltip/tooltip.css" />
		<link rel="stylesheet" type="text/css" href="./controls/icon-toggle/icon-toggle.css" />
		<link
			rel="stylesheet"
			type="text/css"
			href="./controls/progress-indicator/progress-indicator.css"
		/>
		<link rel="stylesheet" type="text/css" href="./project_editor/nav.css" />
		<link rel="stylesheet" type="text/css" href="./pages/editor-pages.css" />
		<link rel="stylesheet" type="text/css" href="./pages/content-pages.css" />
		<link rel="stylesheet" type="text/css" href="./app/app-pages.css" />
		<link rel="stylesheet" type="text/css" href="./app/cross_project_actions/cross-project.css" />
		<link rel="stylesheet" type="text/css" href="./panels/panels.css" />
		<link rel="stylesheet" type="text/css" href="./panels/sidebar.css" />
		<link rel="stylesheet" type="text/css" href="./panels/quality-checks.css" />
		<link rel="stylesheet" type="text/css" href="./controls/command-palette/command-palette.css" />
		<link rel="stylesheet" type="text/css" href="./formats_io/atlas/atlas-export.css" />
		<link rel="stylesheet" type="text/css" href="./icon_font/icon-font.css" />
		<link rel="stylesheet" type="text/css" href="./anchors/anchors.css" />
		<link rel="stylesheet" type="text/css" href="./metrics/metrics.css" />
	</head>

	<body
		style="
			width: 100%;
			height: 100%;
			min-width: 100%;
			min-height: 100%;
			margin: 0;
			padding: 0;
		"
	>
		<div id="app__landing-page">
			<div class="splash__brand">
				<svg class="splash__mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Glyva">
					<g class="splash__path" style="--t: 1240ms" fill="none" stroke="currentColor" stroke-width=".7" stroke-linecap="round" stroke-linejoin="round">
						<path class="splash__draw" style="--d: 180ms; --t: 120ms" pathLength="1" d="M15.75 3.5H12"/>
						<path class="splash__draw" style="--d: 640ms; --t: 300ms" pathLength="1" d="M12 3.5A8.5 8.5 0 0 0 12 20.5"/>
						<path class="splash__draw" style="--d: 320ms; --t: 1060ms" pathLength="1" d="M12 10H20.5"/>
					</g>
					<g fill="currentColor">
						<path class="splash__pop" style="--t: 0ms" d="M16.965 2H17.535C18.41 2 18.75 2.34 18.75 3.215V3.785C18.75 4.66 18.41 5 17.535 5H16.965C16.09 5 15.75 4.66 15.75 3.785V3.215C15.75 2.34 16.09 2 16.965 2Z"/>
						<circle class="splash__pop" style="--t: 300ms" cx="12" cy="3.5" r="1.4"/>
						<circle class="splash__pop" style="--t: 620ms" cx="3.5" cy="12" r="1.4"/>
						<circle class="splash__pop" style="--t: 940ms" cx="12" cy="20.5" r="1.4"/>
						<circle class="splash__pop" style="--t: 1380ms" cx="20.5" cy="10" r="1.4"/>
						<path class="splash__spur" style="--t: 1240ms" d="M12 10.35C17.6 10.35 20.5 10 20.5 16.8V19.96C20.5 20.35 20.35 20.5 19.96 20.5H17.79C17.4 20.5 17.25 20.35 17.25 19.96V15.735C17.25 13.229 15.534 11.019 13.087 10.473C12.739 10.394 12.375 10.35 12 10.35Z"/>
					</g>
					<g fill="none" stroke="currentColor" stroke-width=".5">
						<g class="splash__nib" style="--p: path('M15.75 3.5H12'); --d: 180ms; --t: 120ms"><circle r="1.1"/><circle r=".35" fill="currentColor" stroke="none"/></g>
						<g class="splash__nib" style="--p: path('M12 3.5A8.5 8.5 0 0 0 12 20.5'); --d: 640ms; --t: 300ms"><circle r="1.1"/><circle r=".35" fill="currentColor" stroke="none"/></g>
						<g class="splash__nib" style="--p: path('M12 20.5V10'); --d: 120ms; --t: 940ms"><circle r="1.1"/><circle r=".35" fill="currentColor" stroke="none"/></g>
						<g class="splash__nib" style="--p: path('M12 10H20.5'); --d: 320ms; --t: 1060ms"><circle r="1.1"/><circle r=".35" fill="currentColor" stroke="none"/></g>
					</g>
				</svg>
				<div class="splash__name" style="--t: 1640ms">Glyva</div>
			</div>
			<script>
				setTimeout(function () {
					let errorDiv = document.querySelector('#errorMessage');
					if (errorDiv) {
						errorDiv.style.display = 'block';
						document.querySelector('.splash__brand').style.display = 'none';
					}
				}, 5000);
			</script>

			<!--
				The pre-JavaScript failure screen: shown by the timeout above when
				the app has not booted after five seconds.

				This is the one place in the app that cannot read PRODUCT_NAME,
				because by the time it is on screen the modules that would export
				it have failed. The name here is a literal on purpose, and it is
				the only one left outside brand.js - keep it in step with
				PRODUCT_NAME and with the <title> above.

				It can still read the token layer: tokens.css is a stylesheet link,
				loaded independently of the scripts that failed.

				It used to lead with ¯\_(ツ)_/¯ at 80px and "Bummer." That was the
				sibling of the table flip that used to head the crash screen, and
				it went for the same reason - see .app-error in app/app.css.
			-->
			<div id="errorMessage" style="display: none; max-width: 420px">
				<div style="font-size: 15px; line-height: 1.5; color: var(--text-secondary)">
					<strong style="font-size: 20px; font-weight: 600; color: var(--text-primary)"
						>Glyva could not start</strong
					>
					<br /><br />
					This usually means the browser is too old for it. The current version of
					Firefox, Edge, Chrome or Safari should work.
					<br /><br />
					If you are on one of those already, tell us and we will look at it:
					<a
						style="color: var(--text-accent)"
						href="mailto:hello@bluerain.studio?subject=Glyva%20could%20not%20start"
						>hello@bluerain.studio</a
					>
				</div>
			</div>
		</div>

		<div id="app__wrapper"></div>
	</body>
</html>
