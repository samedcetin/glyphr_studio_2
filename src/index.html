	<head>
		<meta charset="utf-8" />
		<script>
			/*
				Blocking on purpose, and tiny. Stamps data-theme before first paint
				so there is no flash of the wrong theme. common/theme.js re-applies
				this with the full logic once modules load.
			*/
			(function () {
				try {
					var pref = 'system';
					var raw = window.localStorage.getItem('GlyphrStudio');
					if (raw) {
						var stored = JSON.parse(raw).themePreference;
						if (stored) pref = stored;
					}
					var dark =
						pref === 'dark' ||
						(pref === 'system' &&
							window.matchMedia &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>
		<!--
			The tab name before any script runs. main.js sets it from PRODUCT_NAME
			once the app boots, so this is the first-paint value rather than the
			source of truth - but it is what someone sees if the app never starts,
			so keep it in step with the constant.
		-->
		<title>Blue Rain Type</title>
		<meta name="viewport" content="width=device-width" />
		<link rel="shortcut icon" href="./common/graphics/logo-icon-color.ico" />
		<link rel="manifest" href="manifest.json" />
		<script src="app/main.js" type="module"></script>
		<script type="module">
			import { glyphrStudioOnLoad, getGlyphrStudioApp, log } from './app/main.js';
			window.log = log;
			document.addEventListener('DOMContentLoaded', glyphrStudioOnLoad);
			window._GlyphrStudioApp = getGlyphrStudioApp();
		</script>
		<style>
			/*
				The boot splash's own colours, and the one place in the app where a
				literal is the right answer.

				This ground is a fixed dark gradient - it does not follow the theme,
				because it is on screen before there is an app to have a theme. So
				the text on it cannot follow the theme either: reaching for
				--text-primary here put near-black type on a dark gradient the
				moment the app was in light mode. Measured, in light mode, before
				these three lines existed.

				Declared together rather than inlined, so the ground and what sits
				on it are read and changed as one thing.
			*/
			:root {
				--dark-gradient-background: linear-gradient(
					135deg,
					hsl(200, 100%, 12%),
					hsl(285, 100%, 10%)
				);
				--splash-text: hsl(220, 18%, 92%);
				--splash-text-muted: hsl(220, 12%, 72%);
				--splash-link: hsl(212, 90%, 72%);
			}

			body,
			#app__wrapper,
			#app__landing-page {
				height: 100%;
				width: 100%;
				min-height: 100%;
				min-width: 100%;
				position: absolute;
				top: 0px;
				left: 0px;
				overflow: hidden;
			}

			body {
				background: var(--dark-gradient-background);
			}

			#app__wrapper {
				background-color: #161d20;
			}

			#app__landing-page {
				font-family: sans-serif;
				opacity: 1;
				visibility: visible;
				transition: opacity 500ms ease-out;
				background-color: #0e1214;
				padding: auto;
				text-align: left;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding-bottom: 189px;
				background: var(--dark-gradient-background);
			}

			#app__landing-page svg,
			#app__landing-page #errorMessage {
				margin: 90px 0px 0px 50px;
			}

			.mainLogo {
				fill: url(#logoGradient);
				width: 300px;
			}

			.mainLogo .logoWords {
				fill: transparent;
				stroke-width: 0.4px;
				stroke: var(--blue-l50);
			}

			/*
				The crash screen used to be styled here, and borrowed the splash's
				box above to sit in: .error-page__wrapper, .error-page__table-flip
				and their three descendants, which between them held four legacy
				ramps, `color: white`, two colour literals and a `monospace`.

				It has its own surface now - see .app-error in app/app.css, a real
				stylesheet that can read the token layer. This block styles the boot
				splash only: what is on screen before app.css has loaded, which is
				the one place inline CSS earns its place.
			*/
		</style>
		<!--
			Load order matters: tokens define the variables, colors maps the legacy
			ramps onto them, and everything after consumes both.
		-->
		<link rel="stylesheet" type="text/css" href="./common/tokens.css" />
		<link rel="stylesheet" type="text/css" href="./common/colors.css" />
		<link rel="stylesheet" type="text/css" href="./common/resets.css" />
		<link rel="stylesheet" type="text/css" href="./app/app.css" />
		<link rel="stylesheet" type="text/css" href="./controls/dialogs/dialogs.css" />
		<link rel="stylesheet" type="text/css" href="./controls/fancy-slider/fancy-slider.css" />
		<link rel="stylesheet" type="text/css" href="./controls/tabs/tab-control.css" />
		<link rel="stylesheet" type="text/css" href="./controls/menu-button/menu-button.css" />
		<link rel="stylesheet" type="text/css" href="./controls/tooltip/tooltip.css" />
		<link rel="stylesheet" type="text/css" href="./controls/icon-toggle/icon-toggle.css" />
		<link
			rel="stylesheet"
			type="text/css"
			href="./controls/progress-indicator/progress-indicator.css"
		/>
		<link rel="stylesheet" type="text/css" href="./project_editor/nav.css" />
		<link rel="stylesheet" type="text/css" href="./pages/editor-pages.css" />
		<link rel="stylesheet" type="text/css" href="./pages/content-pages.css" />
		<link rel="stylesheet" type="text/css" href="./app/app-pages.css" />
		<link rel="stylesheet" type="text/css" href="./panels/panels.css" />
		<link rel="stylesheet" type="text/css" href="./panels/sidebar.css" />
		<link rel="stylesheet" type="text/css" href="./panels/quality-checks.css" />
		<link rel="stylesheet" type="text/css" href="./controls/command-palette/command-palette.css" />
		<link rel="stylesheet" type="text/css" href="./formats_io/atlas/atlas-export.css" />
		<link rel="stylesheet" type="text/css" href="./icon_font/icon-font.css" />
		<link rel="stylesheet" type="text/css" href="./anchors/anchors.css" />
		<link rel="stylesheet" type="text/css" href="./metrics/metrics.css" />
	</head>

	<body
		style="
			background-color: var(--dark-gradient-background);
			width: 100%;
			height: 100%;
			min-width: 100%;
			min-height: 100%;
			margin: 0;
			padding: 0;
		"
	>
		<div id="app__landing-page">
			<svg
				version="1.1"
				xmlns="http://www.w3.org/2000/svg"
				xmlns:xlink="http://www.w3.org/1999/xlink"
				xml:space="preserve"
				viewBox="0 0 200 128"
				enable-background="new 0 0 200 128"
				class="mainLogo"
			></svg>
			<script>
				setTimeout(function () {
					let errorDiv = document.querySelector('#errorMessage');
					if (errorDiv) {
						errorDiv.style.display = 'block';
						document.querySelector('.mainLogo').style.display = 'none';
					}
				}, 5000);
			</script>

			<!--
				The pre-JavaScript failure screen: shown by the timeout above when
				the app has not booted after five seconds.

				This is the one place in the app that cannot read PRODUCT_NAME,
				because by the time it is on screen the modules that would export
				it have failed. The name here is a literal on purpose, and it is
				the only one left outside brand.js - keep it in step with
				PRODUCT_NAME and with the <title> above.

				It can still read the token layer: tokens.css is a stylesheet link,
				loaded independently of the scripts that failed.

				It used to lead with ¯\_(ツ)_/¯ at 80px and "Bummer." That was the
				sibling of the table flip that used to head the crash screen, and
				it went for the same reason - see .app-error in app/app.css.
			-->
			<div id="errorMessage" style="display: none; max-width: 420px; margin: auto">
				<div style="font-size: 15px; line-height: 1.5; color: var(--splash-text-muted)">
					<strong style="font-size: 20px; font-weight: 600; color: var(--splash-text)"
						>Blue Rain Type could not start</strong
					>
					<br /><br />
					This usually means the browser is too old for it. The current version of
					Firefox, Edge, Chrome or Safari should work.
					<br /><br />
					If you are on one of those already, tell us and we will look at it:
					<a
						style="color: var(--splash-link)"
						href="mailto:hello@bluerain.studio?subject=Blue%20Rain%20Type%20could%20not%20start"
						>hello@bluerain.studio</a
					>
				</div>
			</div>
		</div>

		<div id="app__wrapper"></div>
	</body>
</html>
